spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lowerCaseServiceId: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

    instance:
      prefer-ip-address: true
      hostname: localhost
      instance-id: ${spring.application.name}:${random.value}
